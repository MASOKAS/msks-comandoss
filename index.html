<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Buscador de comandos, teclas e items del servidor MSKS (MASOKAS RP)">
<title>Comandos MSKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Diseño: consola de staff MSKS — barra de búsqueda fija arriba, índice de categorías a la izquierda, filas de comandos escaneables */
:root{
  --bg:#f6f3f6; --panel:#ffffff; --panel2:#f1ecf1; --line:#e4dbe3; --fg:#1d1720; --muted:#6f6474;
  --pink:#d6157a; --pink2:#ff2d95; --pinkbg:#ffe3f1; --pinkline:#f5a6cf;
  --ok:#11845a; --okbg:#dcf6ea; --warn:#9a5b00; --warnbg:#fff0d6; --info:#1f5fae; --infobg:#e0ecfb;
  --red:#b42323; --redbg:#fde3e3; --vio:#6b3fb3; --viobg:#ece3fb; --grey:#55505a; --greybg:#ece9ee;
  --kbd:#fff; --kbdline:#cfc4cf;
  --display:'Poppins',system-ui,sans-serif; --body:'Poppins',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0a0e; --panel:#141218; --panel2:#1b1820; --line:#2a2530; --fg:#f2eef4; --muted:#9c93a3;
  --pink:#ff6ab8; --pink2:#ff2d95; --pinkbg:#3a1029; --pinkline:#7a2356;
  --ok:#3ddc84; --okbg:#0f2a1d; --warn:#ffb547; --warnbg:#2e2210; --info:#7fb3ff; --infobg:#122238;
  --red:#ff6b6b; --redbg:#331414; --vio:#b993ff; --viobg:#241a38; --grey:#bdb6c2; --greybg:#24212a;
  --kbd:#201d25; --kbdline:#3a3441; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b0a0e; --panel:#141218; --panel2:#1b1820; --line:#2a2530; --fg:#f2eef4; --muted:#9c93a3;
  --pink:#ff6ab8; --pink2:#ff2d95; --pinkbg:#3a1029; --pinkline:#7a2356;
  --ok:#3ddc84; --okbg:#0f2a1d; --warn:#ffb547; --warnbg:#2e2210; --info:#7fb3ff; --infobg:#122238;
  --red:#ff6b6b; --redbg:#331414; --vio:#b993ff; --viobg:#241a38; --grey:#bdb6c2; --greybg:#24212a;
  --kbd:#201d25; --kbdline:#3a3441; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 16px 12px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;text-wrap:balance}
.brand h1 b{color:var(--pink2)}
.brand small{color:var(--muted);font-size:12px}
.searchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 320px;min-width:0;position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);padding:0 14px 0 40px;font:500 15px var(--body);outline:none}
.search input:focus{border-color:var(--pink2)}
.search svg{position:absolute;left:13px;top:13px;width:18px;height:18px;stroke:var(--muted)}
.access{display:flex;gap:6px;flex-wrap:wrap}
.vars{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vars label{display:flex;align-items:center;gap:6px;font:600 12px var(--body);color:var(--muted)}
.vars input{width:78px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);padding:0 10px;font:700 13px var(--mono);outline:none}
.vars input:focus{border-color:var(--pink2)}
.crow{grid-template-columns:minmax(0,260px) minmax(0,1fr) auto}
.cname b{display:block;font-size:14px}
.cname small{display:block;font:500 11.5px var(--mono);color:var(--muted);word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chipcmd{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:9px;padding:5px 9px;cursor:pointer;font:600 12.5px var(--mono);text-align:left;max-width:100%}
.chipcmd:hover{border-color:var(--pinkline)}
.chipcmd em{font:600 11px var(--body);font-style:normal;color:var(--muted)}
.chipcmd svg{width:12px;height:12px;stroke:var(--muted);flex:none}
.chipcmd.done{border-color:var(--ok);color:var(--ok)}
.chipcmd code{font:inherit;word-break:break-all}
.more{margin:8px 0 0;border:1px dashed var(--pinkline);background:transparent;color:var(--pink);border-radius:10px;padding:8px 12px;font:700 12px var(--body);cursor:pointer;width:100%}
.navhead{font:700 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 10px 2px}
.b-cat{background:var(--pinkbg);color:var(--pink)}
.access button,.cats button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 11px;font:600 12px var(--body);cursor:pointer}
.access button[aria-pressed="true"],.cats button[aria-pressed="true"]{background:var(--pink2);border-color:var(--pink2);color:#fff}
.access button:focus-visible,.cats button:focus-visible,.copy:focus-visible,.search input:focus-visible{outline:2px solid var(--pink2);outline-offset:2px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;margin-top:18px}
nav.cats{position:sticky;top:150px;align-self:start;display:flex;flex-direction:column;gap:4px}
nav.cats button{display:flex;justify-content:space-between;gap:8px;border-radius:10px;text-align:left;border-color:transparent;background:transparent;padding:7px 10px;font-size:13px}
nav.cats button span{color:var(--muted);font:500 12px var(--mono)}
nav.cats button[aria-pressed="true"] span{color:#fff}
nav.cats button:hover{background:var(--panel2)}
nav.cats button[aria-pressed="true"]:hover{background:var(--pink2)}
.legend{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:12px;color:var(--muted);display:grid;gap:6px}
.legend b{color:var(--fg)}
main{min-width:0}
.summary{color:var(--muted);font-size:13px;margin:0 0 12px}
.summary b{color:var(--fg)}
section.cat{margin-bottom:26px}
section.cat h2{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
section.cat h2 small{letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500}
.list{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) auto;gap:6px 16px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.row.dead{opacity:.55}
.cmdcell{display:flex;gap:8px;align-items:flex-start;min-width:0}
.cmd{font:700 13.5px var(--mono);color:var(--fg);word-break:break-word}
.cmd .slash{color:var(--pink2)}
.cmd .args{font-weight:500;color:var(--muted)}
.copy{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:7px;width:26px;height:24px;cursor:pointer;display:grid;place-items:center}
.copy svg{width:13px;height:13px;stroke:currentColor}
.copy.done{color:var(--ok);border-color:var(--ok)}
.desc{min-width:0}
.desc p{margin:0}
.desc .tr{font-size:12px;color:var(--muted);margin-top:2px}
.desc .tr i{font-style:normal;color:var(--pink)}
.desc .note{font-size:12px;color:var(--warn);margin-top:3px}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.badge{font:700 10.5px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-T{background:var(--okbg);color:var(--ok)} .b-J{background:var(--infobg);color:var(--info)} .b-S{background:var(--warnbg);color:var(--warn)}
.b-O{background:var(--viobg);color:var(--vio)} .b-A{background:var(--redbg);color:var(--red)} .b-C{background:var(--greybg);color:var(--grey)}
.res{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
kbd{font:700 12px var(--mono);background:var(--kbd);border:1px solid var(--kbdline);border-bottom-width:3px;border-radius:6px;padding:1px 7px;color:var(--fg);white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
mark{background:var(--pinkbg);color:inherit;border-radius:3px;padding:0 1px}
.themebtn{margin-left:auto;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:6px 10px;font:600 12px var(--body);cursor:pointer}
@media (max-width:860px){
  .crow{grid-template-columns:1fr}
  .navhead{width:100%;padding:6px 2px 0}
  header.top{position:static}
  .layout{grid-template-columns:1fr}
  nav.cats{position:static;flex-direction:row;flex-wrap:wrap}
  nav.cats button{border-color:var(--line);background:var(--panel);border-radius:999px;padding:5px 10px;font-size:12px}
  .legend{display:none}
  .row{grid-template-columns:1fr;gap:6px}
  .meta{flex-direction:row;align-items:center;justify-content:flex-start}
}
@media (prefers-reduced-motion:no-preference){.copy,.access button,.cats button{transition:background .12s,border-color .12s,color .12s}}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1><b>MSKS</b> · Comandos del servidor</h1>
      <small id="count">—</small>
      <button class="themebtn" id="themebtn" type="button">Cambiar tema</button>
    </div>
    <div class="searchrow">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Busca lo que sea: pistola, ballas, policía, dinero, adder, revivir, ganzúa…" autocomplete="off">
      </label>
      <div class="vars"><label for="vid">ID jugador <input id="vid" type="number" min="0" value="1"></label><label for="vcant">Cantidad <input id="vcant" type="number" min="1" value="1"></label></div>
      <div class="access" id="access" role="group" aria-label="Quién lo puede usar"></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <nav class="cats" id="cats" aria-label="Categorías"></nav>
    <main>
      <p class="summary" id="summary"></p>
      <div id="out"></div>
    </main>
  </div>
</div>

const CATSEC = [['c-armas','Armas'],['c-items','Items'],['c-dinero','Dinero'],['c-trabajos','Trabajos (setjob)'],['c-bandas','Bandas (setgang)'],['c-coches','Vehículos (/car)']];
let vId = '1', vCant = '1';
try { vId = localStorage.getItem('msks-vid') || '1'; vCant = localStorage.getItem('msks-vcant') || '1'; } catch(_) {}
const fill = t => t.replace(/\{id\}/g, vId || '1').replace(/\{n\}/g, vCant || '1');
const ICON_MINI = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
function chip(tpl, label){ const c = fill(tpl); return `<button type="button" class="chipcmd" data-copy="${esc(c)}"><code>${esc(c)}</code>${label?`<em>${esc(label)}</em>`:''}${ICON_MINI}</button>`; }
// entradas del catálogo: {sec, name, sub, badge, hay, chips:[[tpl,label]], note}
const ENTRIES = [];
(function(){
  for(const [k, es, en, c, ammo] of CAT.items){
    const weapon = k.startsWith('weapon_');
    const chips = weapon ? [[`/giveitem {id} ${k} 1`, 'el arma']] : [[`/giveitem {id} ${k} {n}`, '']];
    if(weapon && ammo) chips.push([`/giveitem {id} ${ammo} 250`, '250 balas']);
    ENTRIES.push({sec: weapon ? 'c-armas' : 'c-items', name: es, sub: k + (en && en !== es ? ' · ' + en : ''), badge: c, hay: [k,es,en,c,ammo, weapon?'arma armas':'item objeto'].join(' '), chips,
      note: k==='dinerosucio' ? '1 unidad = 1 €. Se lava en /org o en la lavandería.' : (k==='markedbills' ? 'Antiguo de qb: ya no se usa (no se puede lavar).' : '')});
  }
  ENTRIES.push({sec:'c-dinero', name:'Dinero en efectivo', sub:'cash', badge:'Dinero', hay:'dinero efectivo cash pasta billetes', chips:[['/givemoney {id} cash {n}','dar'],['/setmoney {id} cash {n}','fijar']]});
  ENTRIES.push({sec:'c-dinero', name:'Dinero en el banco', sub:'bank', badge:'Dinero', hay:'dinero banco bank cuenta', chips:[['/givemoney {id} bank {n}','dar'],['/setmoney {id} bank {n}','fijar']]});
  ENTRIES.push({sec:'c-dinero', name:'Cripto (qb)', sub:'crypto', badge:'Dinero', hay:'dinero cripto crypto', chips:[['/givemoney {id} crypto {n}','dar'],['/setmoney {id} crypto {n}','fijar']]});
  ENTRIES.push({sec:'c-dinero', name:'Dinero sucio', sub:'dinerosucio (item)', badge:'Dinero', hay:'dinero sucio negro blanquear lavar dinerosucio', chips:[['/giveitem {id} dinerosucio {n}','']], note:'Se lava en /org (15 %) o en la lavandería pública (40 %).'});
  ENTRIES.push({sec:'c-dinero', name:'Monedas VIP', sub:'msks-vipshop', badge:'Dinero', hay:'monedas vip coins tienda', chips:[['/monedas {id} +{n}','sumar'],['/monedas {id} -{n}','restar'],['/monedas {id}','ver']]});
  for(const [k, en, es, type, grades] of CAT.jobs){
    ENTRIES.push({sec:'c-trabajos', name: es, sub: k + ' · ' + en + (type ? ' · tipo ' + type : ''), badge:'Trabajo', hay:[k,en,es,type,'trabajo job empleo',grades.map(g=>g[1]+' '+g[3]).join(' ')].join(' '),
      chips: grades.map(g => [`/setjob {id} ${k} ${g[0]}`, `${g[0]} · ${g[3] || g[1]}${g[2] ? ' (jefe)' : ''}`])});
  }
  for(const [k, label, grades] of CAT.gangs){
    const none = k === 'none';
    ENTRIES.push({sec:'c-bandas', name: none ? 'Quitar la banda' : label, sub: k, badge: none ? 'Banda' : 'Banda', hay:[k,label,'banda gang organizacion mafia',grades.map(g=>g[1]).join(' ')].join(' '),
      chips: grades.map(g => [`/setgang {id} ${k} ${g[0]}`, none ? 'sin banda' : `${g[0]} · ${g[1]}${g[2] ? ' (jefe)' : ''}`]),
      note: none ? '' : 'Con la banda: /org (tablet). Guerras por la sede: las abre el staff con /conquista.'});
  }
  for(const [code, name, brand, c, price] of CAT.veh){
    ENTRIES.push({sec:'c-coches', name: (brand ? brand + ' ' : '') + name, sub: code + (price ? ' · ' + Number(price).toLocaleString('es-ES') + ' €' : ''), badge: c, hay:[code,name,brand,c,'coche vehiculo car'].join(' '), chips:[[`/car ${code}`, '']]});
  }
})();
const isCatSec = id => id.startsWith('c-');
function catRows(list, terms){
  return list.map(e => `<div class="row crow"><div class="cname"><b>${hl(e.name,terms)}</b><small>${hl(e.sub,terms)}</small></div>
    <div class="desc"><div class="chips">${e.chips.map(c=>chip(c[0],c[1])).join('')}</div>${e.note?`<p class="note">${esc(e.note)}</p>`:''}</div>
    <div class="meta"><span class="badge b-cat">${esc(e.badge)}</span><span class="res">Admin General</span></div></div>`).join('');
}
function renderCatalog(terms){
  if(acc !== 'all' && acc !== 'A') return {html:'', total:0};
  let html = '', total = 0;
  for(const [sid, sname] of CATSEC){
    if(cat !== 'all' && cat !== sid) continue;
    let list = ENTRIES.filter(e => e.sec === sid && (!terms.length || terms.every(t => norm(e.hay + ' ' + e.name).includes(t))));
    if(!list.length) continue;
    total += list.length;
    const limit = cat === sid ? Infinity : (terms.length ? 40 : 6);
    const shown = list.slice(0, limit);
    html += `<section class="cat"><h2>${esc(sname)} <small>${list.length} · comando listo para copiar con el ID y la cantidad de arriba</small></h2><div class="list">${catRows(shown, terms)}</div>` +
      (list.length > shown.length ? `<button class="more" type="button" data-go="${sid}">Ver los ${list.length}</button>` : '') + '</section>';
  }
  return {html, total};
}

const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>';

function hl(text, terms){
  let out = esc(text);
  if(!terms.length) return out;
  // resaltado sencillo sin acentos: se marca la palabra si coincide al normalizar
  return out.replace(/[\wÀ-ÿ]+/g, w => terms.some(t => t.length>1 && norm(w).includes(t)) ? '<mark>'+w+'</mark>' : w);
}
function matches(c, terms){
  if(!terms.length) return true;
  const hay = norm([c[0],c[1],c[2],c[5],c[6],c[7],c[8], CATS.find(x=>x[0]===c[4])[1]].join(' '));
  return terms.every(t => hay.includes(t));
}
function render(){
  const terms = norm(q).split(/\s+/).filter(Boolean).map(t=>t.replace(/^\//,''));
  const out = document.getElementById('out');
  let html = '', total = 0;
  const cr = renderCatalog(terms); html += cr.html; total += cr.total;
  for(const [cid, cname] of CATS){
    if(cat !== 'all' && cat !== cid) continue;
    if(cid === 'teclas'){
      const rows = K.filter(k => (acc==='all'||acc===k[4]) && (!terms.length || terms.every(t=>norm(k.join(' ')+' tecla').includes(t))));
      if(!rows.length) continue;
      total += rows.length;
      html += `<section class="cat" id="c-${cid}"><h2>${esc(cname)} <small>${rows.length} · se cambian en Ajustes › Teclas › FiveM</small></h2><div class="list">` +
        rows.map(k=>`<div class="row"><div class="cmdcell"><kbd>${esc(k[0])}</kbd></div><div class="desc"><p>${hl(k[1],terms)}</p><p class="tr">Comando de tecla: <i>${esc(k[2])}</i></p></div><div class="meta"><span class="badge b-${k[4]}">${ACCESS[k[4]].label}</span><span class="res">${esc(k[3])}</span></div></div>`).join('') + '</div></section>';
      continue;
    }
    const rows = C.filter(c => c[4]===cid && (acc==='all'||acc===c[3]) && matches(c, terms));
    if(!rows.length) continue;
    total += rows.length;
    html += `<section class="cat" id="c-${cid}"><h2>${esc(cname)} <small>${rows.length}</small></h2><div class="list">` + rows.map(c => {
      const full = '/' + c[0] + (c[1] ? ' ' + c[1] : '');
      return `<div class="row${/Sustituye|no tiene efecto|desactivará/i.test(c[7])?'':''}">
        <div class="cmdcell"><button class="copy" type="button" data-copy="/${esc(c[0])}" aria-label="Copiar /${esc(c[0])}">${ICON_COPY}</button>
          <span class="cmd"><span class="slash">/</span>${hl(c[0],terms)}${c[1]?' <span class="args">'+esc(c[1])+'</span>':''}</span></div>
        <div class="desc"><p>${hl(c[2],terms)}</p>${c[6]?`<p class="tr">Traducción: <i>${esc(c[6])}</i></p>`:''}${c[7]?`<p class="note">${esc(c[7])}</p>`:''}</div>
        <div class="meta"><span class="badge b-${c[3]}" title="${esc(ACCESS[c[3]].hint)}">${ACCESS[c[3]].label}</span><span class="res">${esc(c[5])}</span></div></div>`;
    }).join('') + '</div></section>';
  }
  out.innerHTML = html || `<div class="empty">No hay nada que coincida con "<b>${esc(q)}</b>". Prueba con otra palabra (en español o inglés) o quita los filtros.</div>`;
  document.getElementById('summary').innerHTML = (q||acc!=='all'||cat!=='all') ? `<b>${total}</b> resultado(s)` : `<b>${C.length}</b> comandos, <b>${K.length}</b> teclas y <b>${ENTRIES.length}</b> items, armas, trabajos, bandas y vehículos · pon arriba el ID del jugador y pulsa un comando para copiarlo`;
}
function buildFilters(){
  const a = document.getElementById('access');
  a.innerHTML = `<button type="button" data-acc="all" aria-pressed="true">Cualquiera</button>` + Object.entries(ACCESS).map(([k,v])=>`<button type="button" data-acc="${k}" aria-pressed="false" title="${esc(v.hint)}">${v.label}</button>`).join('');
  a.addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; acc = b.dataset.acc; a.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); });
  const n = document.getElementById('cats');
  const count = id => id==='teclas' ? K.length : C.filter(c=>c[4]===id).length;
  const ccount = id => ENTRIES.filter(e=>e.sec===id).length;
  n.innerHTML = `<button type="button" data-cat="all" aria-pressed="true">Todo <span>${C.length+K.length+ENTRIES.length}</span></button><div class="navhead">Catálogo</div>` + CATSEC.map(([id,name])=>`<button type="button" data-cat="${id}" aria-pressed="false">${esc(name)} <span>${ccount(id)}</span></button>`).join('') + `<div class="navhead">Comandos</div>` + CATS.map(([id,name])=>`<button type="button" data-cat="${id}" aria-pressed="false">${esc(name)} <span>${count(id)}</span></button>`).join('') +
    `<div class="legend"><div><b>Quién lo puede usar</b></div>${Object.values(ACCESS).map(v=>`<div><b>${v.label}:</b> ${esc(v.hint)}</div>`).join('')}<div>Los comandos de qb marcados "admin" o "god" solo los tiene el <b>Admin General</b> (el rango admin de /staff da los permisos de qb).</div></div>`;
  n.addEventListener('click', e => { const b = e.target.closest('button'); if(!b || !b.dataset.cat) return; cat = b.dataset.cat; n.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); });
}
document.addEventListener('click', e => {
  const mo = e.target.closest('.more');
  if(mo){ selectCat(mo.dataset.go); return; }
  const b = e.target.closest('.copy, .chipcmd'); if(!b) return;
  const txt = b.dataset.copy;
  const chipMode = b.classList.contains('chipcmd');
  const done = () => { b.classList.add('done'); if(!chipMode) b.innerHTML = ICON_OK; setTimeout(()=>{ b.classList.remove('done'); if(!chipMode) b.innerHTML = ICON_COPY; }, 1200); };
  try { navigator.clipboard.writeText(txt).then(done, () => fallback(txt, done)); } catch(_) { fallback(txt, done); }
});
function fallback(txt, done){
  const i = document.getElementById('q'); const old = i.value; i.value = txt; i.select();
  try { document.execCommand('copy'); done(); } catch(_) {}
  setTimeout(()=>{ i.value = old; }, 50);
}
function selectCat(id){ cat = id; document.querySelectorAll('#cats button[data-cat]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.cat===id)); render(); window.scrollTo({top:0}); }
const vi = document.getElementById('vid'), vc = document.getElementById('vcant');
vi.value = vId; vc.value = vCant;
vi.addEventListener('input', () => { vId = vi.value.trim(); try{localStorage.setItem('msks-vid', vId);}catch(_){} render(); });
vc.addEventListener('input', () => { vCant = vc.value.trim(); try{localStorage.setItem('msks-vcant', vCant);}catch(_){} render(); });
const qi = document.getElementById('q');
qi.addEventListener('input', () => { q = qi.value.trim(); render(); });
document.addEventListener('keydown', e => { if(e.key === '/' && document.activeElement !== qi){ e.preventDefault(); qi.focus(); } if(e.key==='Escape' && document.activeElement===qi){ qi.value=''; q=''; render(); } });
document.getElementById('themebtn').addEventListener('click', () => {
  const r = document.documentElement; const cur = r.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; r.setAttribute('data-theme', next); try { localStorage.setItem('msks-theme', next); } catch(_) {}
});
try { const t = localStorage.getItem('msks-theme'); if(t) document.documentElement.setAttribute('data-theme', t); } catch(_) {}
document.getElementById('count').textContent = `${C.length} comandos · ${K.length} teclas · ${ENTRIES.length} en el catálogo · actualizado 07/10/2026`;
buildFilters(); render();
</script>
